spring:
  datasource:
    # DÙNG H2 DẠNG FILE, LƯU Ở target/h2db
    # AUTO_SERVER=TRUE → cho nhiều kết nối (test song song)
    # DB_CLOSE_DELAY=-1 → giữ DB mở mãi (thay cho DB_CLOSE_ON_EXIT=FALSE)
    url: jdbc:h2:file:./target/h2db/testdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # BẮT BUỘC: TẮT JDBC SESSION TRONG TEST
  session:
    store-type: none

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE